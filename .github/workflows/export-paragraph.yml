name: Export Paragraph archive

# One-time (re-runnable) export of every Pioneering Spirit post on Paragraph
# into corpus/paragraph/, committed back to the branch you run it on.
# Run it from the Actions tab. PARAGRAPH_API_KEY is optional for public posts.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export posts
        run: node tools/paragraph-export.mjs
        env:
          PARAGRAPH_API_KEY: ${{ secrets.PARAGRAPH_API_KEY }}

      - name: Commit the corpus
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add corpus/paragraph
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "corpus: export Paragraph archive $(date -u +%Y-%m-%d)"
          git push
