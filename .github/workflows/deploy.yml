name: Deploy blyg

# Deploys the Worker (and the static Paragraph archive) to pioneeringspirit.xyz.
# Runs on pushes to main that touch the deployment, or by hand from the
# Actions tab. Writing and publishing never go through here: posts live in
# the blyg's D1 database, written through the studio or `npm run blyg`.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.jsonc"
      - "corpus/paragraph/**"
      - "tools/build-archive.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to deploy an unprovisioned config
        run: |
          if grep -q "REPLACE_WITH_" wrangler.jsonc; then
            echo "::error::wrangler.jsonc still has placeholder account_id or database_id. Follow 'Provision Cloudflare' in the README first."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and test the reference client
        run: |
          npm run typecheck
          npm test

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply pioneering-spirit-blyg --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build archive and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify the live surfaces
        run: |
          for p in blyg.json feed.xml items/index.json; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://pioneeringspirit.xyz/$p?ci=$GITHUB_RUN_ID")
            echo "$p -> $code"
            [ "$code" = "200" ] || exit 1
          done
