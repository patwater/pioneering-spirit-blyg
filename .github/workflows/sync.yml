name: Sync Paragraph → Blyg

on:
  schedule:
    # Daily at 06:17 UTC (roughly 11pm PT — after any late-night publishing)
    - cron: "17 6 * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write         # needed to commit id-map.json back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so the id-map commit doesn't clobber anything
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests

      - name: Generate blyg files
        env:
          PARAGRAPH_API_KEY: ${{ secrets.PARAGRAPH_API_KEY }}
          PARAGRAPH_DOMAIN: pioneeringspirit.xyz
          BLYG_ORIGIN: https://blyg.pioneeringspirit.xyz/
          OUTPUT_DIR: output
        run: python generate.py

      - name: Commit updated id-map (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add id-map.json
          # Only commit when something actually changed
          git diff --cached --quiet || git commit -m "chore: update id-map after sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy output --project-name=pioneering-spirit-blyg
